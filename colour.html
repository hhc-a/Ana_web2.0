  <title>淡紫色比對</title>

<body>
  <!-- 原本的三個紫色 -->

<div></div>

  <div style="width:200px;height:200px;background:#e6d4fa;border:1px solid #aaa;display:inline-block;margin:5px;"></div>
  <div style="width:200px;height:200px;background:#e9d0ff;border:1px solid #aaa;display:inline-block;margin:5px;"></div>
  <div style="width:200px;height:200px;background:#f2e5ff;border:1px solid #aaa;display:inline-block;margin:5px;"></div>
